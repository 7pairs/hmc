name: Common tests

on:
  pull_request:
    branches: [develop]

permissions:
  contents: read

jobs:
  android-host-tests:
    name: Android host tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the pull request merge commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Temurin 25
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '25'

      - name: Ensure Android SDK packages are installed
        run: |
          missing_packages=()
          if [[ ! -f "$ANDROID_HOME/platforms/android-37.0/android.jar" ]]; then
            missing_packages+=('platforms;android-37.0')
          fi
          if [[ ! -x "$ANDROID_HOME/build-tools/36.0.0/aapt2" ]]; then
            missing_packages+=('build-tools;36.0.0')
          fi
          if (( ${#missing_packages[@]} > 0 )); then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" --install "${missing_packages[@]}"
          fi
          printf 'Android SDK: %s\n' "$ANDROID_HOME"
          printf 'Android SDK packages: %s, %s\n' 'platforms;android-37.0' 'build-tools;36.0.0'

      - name: Run Android host tests
        id: tests
        run: |
          printf 'Checked-out commit: %s\n' "$(git rev-parse HEAD)"
          printf 'JAVA_HOME: %s\n' "$JAVA_HOME"
          ./gradlew :shared:testAndroidHostTest --no-daemon --console=plain --info

      - name: Verify test reports
        id: reports
        run: |
          if ! compgen -G 'shared/build/test-results/testAndroidHostTest/TEST-*.xml' >/dev/null; then
            echo '::error::Android host test XML results are missing.'
            exit 1
          fi
          if [[ ! -f shared/build/reports/tests/testAndroidHostTest/index.html ]]; then
            echo '::error::Android host test HTML report is missing.'
            exit 1
          fi

      - name: Upload test reports
        if: ${{ !cancelled() && (steps.reports.outcome == 'success' || steps.tests.outcome == 'failure') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-host-test-results
          path: |
            shared/build/test-results/testAndroidHostTest/TEST-*.xml
            shared/build/reports/tests/testAndroidHostTest/
          if-no-files-found: warn
